[project]
name = "moe-chanslate"
version = "0.1.0"
description = "Upcycle Qwen3.5-9B into a sparse MoE (~8-9B total, A1B-A2B) for zh->vi translation"
requires-python = ">=3.10"
dependencies = [
  "torch", "transformers>=5.0", "tokenizers", "datasets", "accelerate", "safetensors",
  "pyyaml", "sacrebleu", "tqdm",
]

[project.optional-dependencies]
comet = ["unbabel-comet"]
train = ["bitsandbytes"]

[tool.setuptools.packages.find]
where = ["src"]
